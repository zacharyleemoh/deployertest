<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vibe Playground</title>
<style>
  :root{
    --bg:#0b0b14;
    --panel:rgba(255,255,255,0.06);
    --text:#f2f0ff;
    --sub:#9d97c9;
    --accent:#7c5cff;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f5f3ff;
      --panel:rgba(20,10,50,0.05);
      --text:#191325;
      --sub:#5c5480;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  canvas{
    display:block;
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .hud{
    position:fixed;
    top:calc(16px + env(safe-area-inset-top,0px));
    left:16px;
    right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    z-index:5;
  }
  .title{
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    background:var(--panel);
    backdrop-filter:blur(10px);
    padding:8px 14px;
    border-radius:999px;
    pointer-events:auto;
  }
  .title span{color:var(--sub);font-weight:400;}
  .controls{
    display:flex;
    gap:8px;
    pointer-events:auto;
  }
  button{
    background:var(--panel);
    backdrop-filter:blur(10px);
    border:none;
    color:var(--text);
    width:38px;height:38px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  button:active{transform:scale(0.9);}
  button.active{background:var(--accent);color:white;}
  .hint{
    position:fixed;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    left:0;right:0;
    text-align:center;
    font-size:12px;
    color:var(--sub);
    pointer-events:none;
    z-index:5;
    transition:opacity 1s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title">✨ Vibe Playground <span>· move, click, hold</span></div>
  <div class="controls">
    <button id="modeBtn" title="Change mode">🌀</button>
    <button id="clearBtn" title="Clear">🧹</button>
  </div>
</div>
<div class="hint" id="hint">drag your finger or mouse around — click to burst</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const modes = ['spiral','fireflies','ribbon'];
  let modeIndex = 0;
  const modeIcons = {spiral:'🌀', fireflies:'✨', ribbon:'🎀'};

  let hue = Math.random()*360;
  let particles = [];
  const pointer = { x: W/2, y: H/2, px: W/2, py: H/2, down: false, active: false };

  function spawn(x, y, burst){
    const count = burst ? 26 : 2;
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = burst ? (Math.random()*4+2) : (Math.random()*1.2+0.2);
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: Math.random()*0.012+0.006,
        size: Math.random()*3+1.5,
        hue: (hue + Math.random()*40-20 + 360) % 360
      });
    }
    if(particles.length > 1400) particles.splice(0, particles.length-1400);
  }

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
  }

  function onMove(e){
    const p = pointerPos(e);
    pointer.px = pointer.x; pointer.py = pointer.y;
    pointer.x = p.x; pointer.y = p.y;
    pointer.active = true;
    const mode = modes[modeIndex];
    if(mode === 'fireflies'){
      spawn(p.x + (Math.random()*30-15), p.y + (Math.random()*30-15), false);
    } else {
      spawn(p.x, p.y, false);
    }
  }
  function onDown(e){
    pointer.down = true;
    const p = pointerPos(e);
    spawn(p.x, p.y, true);
    document.getElementById('hint').style.opacity = '0';
    e.preventDefault();
  }
  function onUp(){ pointer.down = false; }

  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchmove', function(e){ onMove(e); e.preventDefault(); }, {passive:false});
  canvas.addEventListener('touchstart', onDown, {passive:false});
  canvas.addEventListener('touchend', onUp);

  let t = 0;
  function step(){
    t += 0.01;
    hue = (hue + 0.15) % 360;

    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';

    const mode = modes[modeIndex];

    if(mode === 'spiral' && pointer.active){
      const swirl = Math.sin(t*3)*1.5;
      pointer.x += Math.cos(t*8)*swirl*0.3;
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      if(mode === 'ribbon'){
        p.vx += Math.sin(p.y*0.02 + t)*0.06;
        p.vy += Math.cos(p.x*0.02 + t)*0.06;
      } else if(mode === 'fireflies'){
        p.vx += (Math.random()-0.5)*0.15;
        p.vy += (Math.random()-0.5)*0.15 - 0.01;
        p.vx *= 0.98; p.vy *= 0.98;
      } else {
        p.vx *= 0.985; p.vy *= 0.985;
      }
      p.x += p.vx; p.y += p.vy;
      p.life -= p.decay;
      if(p.life <= 0){ particles.splice(i,1); continue; }

      const r = p.size * (0.5 + p.life*0.8);
      const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*4);
      grad.addColorStop(0, `hsla(${p.hue},95%,65%,${p.life})`);
      grad.addColorStop(1, `hsla(${p.hue},95%,55%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x,p.y,r*4,0,Math.PI*2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(step);
  }

  // gentle idle fade layer so trails don't overwhelm on light backgrounds
  const fadeCanvas = document.createElement('canvas');
  function fadeLoop(){
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
    requestAnimationFrame(fadeLoop);
  }

  // background wash
  function bgLoop(){
    ctx.save();
    ctx.globalCompositeOperation = 'destination-over';
    const g = ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  requestAnimationFrame(step);
  setInterval(bgLoop, 50);

  document.getElementById('modeBtn').addEventListener('click', function(){
    modeIndex = (modeIndex+1) % modes.length;
    this.textContent = modeIcons[modes[modeIndex]];
    this.classList.add('active');
    setTimeout(()=>this.classList.remove('active'), 200);
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    particles = [];
  });

  // idle ambient sparkle so it's alive even before interaction
  setInterval(function(){
    if(!pointer.down){
      spawn(Math.random()*W, Math.random()*H, false);
    }
  }, 120);
})();
</script>
</body>
</html>
